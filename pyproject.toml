[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance"
dynamic = ["version"]
description = "Local-first personal finance ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypdf==6.21.2", "segno==1.6.6"]

[project.scripts]
pf = "personal_finance.cli:main"

[tool.setuptools.dynamic]
version = {attr = "personal_finance.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"personal_finance.db" = ["migrations/*.sql"]
"personal_finance.snapshot" = ["schema_v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: a test function over about 3 seconds, mostly order and generated-ledger property tests. Commit gates during a slice skip them with -m 'not slow'; the gate before review runs everything (D-078).",
]
